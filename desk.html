<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Board — 3D Works</title>
  <meta name="theme-color" content="#0e0e0e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%230e0e0e' width='32' height='32'/%3E%3Ctext x='4' y='22' fill='%233ddc6a' font-family='Arial' font-size='14' font-weight='700'%3E3D%3C/text%3E%3C/svg%3E">
</head>
<body>
  <main class="board-page" id="content">
    <div class="board-bar">
      <h1>Board</h1>
      <p id="count"></p>
    </div>
    <div class="board" id="board"></div>
  </main>
  <script type="module">
    import { mountChrome } from "./js/chrome.js";
    import { listJobs, saveJob, statuses, jobNo, money } from "./js/store.js";

    mountChrome("desk");
    const board = document.getElementById("board");
    const count = document.getElementById("count");
    let jobs = [];

    await paint();

    async function paint() {
      jobs = await listJobs();
      count.textContent = jobs.length + (jobs.length === 1 ? " job" : " jobs");
      board.innerHTML = statuses().map((status) => {
        const items = jobs.filter((job) => job.status === status);
        const cards = items.map((job) => `
          <a class="card" draggable="true" href="job.html?id=${job.id}" data-id="${job.id}">
            <span class="mono">${jobNo(job.id)}</span>
            <strong>${escapeHtml(job.title)}</strong>
            <span class="meta">${escapeHtml(job.customer)} · ${escapeHtml(job.material)} × ${job.qty}</span>
            <span class="meta">${money(job.price)}</span>
          </a>
        `).join("");
        return `
          <section class="col" data-status="${status}">
            <div class="col-head">${status} <span>${items.length}</span></div>
            <div class="col-list">
              ${cards || '<p class="empty">Nothing here</p>'}
            </div>
          </section>
        `;
      }).join("");

      board.querySelectorAll(".card").forEach((card) => {
        card.addEventListener("dragstart", (event) => {
          event.dataTransfer.setData("text/plain", card.dataset.id);
          event.dataTransfer.effectAllowed = "move";
        });
        card.addEventListener("dragend", () => {
          card.dataset.dragged = "1";
          setTimeout(() => delete card.dataset.dragged, 0);
        });
        card.addEventListener("click", (event) => {
          if (card.dataset.dragged) event.preventDefault();
        });
      });

      board.querySelectorAll(".col").forEach((col) => {
        col.addEventListener("dragover", (event) => {
          event.preventDefault();
          col.classList.add("is-over");
        });
        col.addEventListener("dragleave", () => col.classList.remove("is-over"));
        col.addEventListener("drop", async (event) => {
          event.preventDefault();
          col.classList.remove("is-over");
          const id = event.dataTransfer.getData("text/plain");
          const job = jobs.find((item) => item.id === id);
          if (!job || job.status === col.dataset.status) return;
          job.status = col.dataset.status;
          await saveJob(job);
          await paint();
        });
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[ch]);
    }
  </script>
</body>
</html>
