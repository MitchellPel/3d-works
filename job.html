<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job — 3D Works</title>
  <meta name="theme-color" content="#0e0e0e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%230e0e0e' width='32' height='32'/%3E%3Ctext x='4' y='22' fill='%233ddc6a' font-family='Arial' font-size='14' font-weight='700'%3E3D%3C/text%3E%3C/svg%3E">
</head>
<body>
  <main class="wrap" id="content">
    <section class="split">
      <div class="traveler" id="panel"></div>
      <div class="stage" id="stage" role="region" aria-label="Job model. Drag to turn the part."></div>
    </section>
  </main>
  <script type="module">
    import { mountChrome, stageHtml } from "./js/chrome.js";
    import { getJob, getFile, saveJob, statuses, jobNo, money } from "./js/store.js";
    import { mountViewer } from "./js/viewer.js";

    mountChrome("job");
    const stage = document.getElementById("stage");
    stage.insertAdjacentHTML("beforeend", stageHtml());
    const viewer = mountViewer(stage);
    const panel = document.getElementById("panel");
    const id = new URLSearchParams(location.search).get("id") || "jn-1048";

    const job = await getJob(id);
    if (!job) {
      panel.innerHTML = `<p class="kicker">Missing</p><h1>This job is not on this device.</h1><p class="lede"><a href="index.html">Back to the bench</a></p>`;
    } else {
      document.title = job.title + " — 3D Works";
      if (job.kind === "file") {
        const buffer = await getFile(job.id);
        const ext = (job.fileName.split(".").pop() || "").toLowerCase();
        if (buffer) viewer.showBuffer(buffer, ext, job.color);
        else panel.dataset.missing = "1";
      } else {
        viewer.showKind(job.kind, job.color);
      }
      draw(job);
    }

    function draw(job) {
      const steps = statuses();
      const at = steps.indexOf(job.status);
      const rail = steps.map((name, index) => {
        const cls = index < at ? "done" : index === at ? "now" : "";
        const current = index === at ? ' aria-current="step"' : "";
        return `<li class="${cls}"${current}>${name}</li>`;
      }).join("");
      let action = "";
      if (job.status === "In review") {
        action = `<div class="actions"><button class="btn" type="button" id="approve">Approve this scan</button></div>`;
      } else if (job.status === "Quoted" && job.price != null && !job.paid) {
        action = `<div class="actions"><button class="btn" type="button" id="pay">Mark as paid</button></div><p class="note">Demo only. No card is charged.</p>`;
      } else if (job.paid) {
        action = `<p class="note">Marked paid in this demo.</p>`;
      }
      const missing = panel.dataset.missing
        ? `<p class="note">The mesh is not stored on this device.</p>`
        : "";
      panel.innerHTML = `
        <p class="kicker"><a href="desk.html">Board</a> · ${jobNo(job.id)} · ${escapeHtml(job.customer)}</p>
        <h1>${escapeHtml(job.title)}</h1>
        <p class="lede">${escapeHtml(job.notes || "No notes on this job.")}</p>
        ${missing}
        <p class="price"><small>Price</small>${money(job.price)}</p>
        <ol class="rail">${rail}</ol>
        <dl class="titleblock">
          <div><dt>Material</dt><dd>${escapeHtml(job.material)}</dd></div>
          <div><dt>Quantity</dt><dd>${job.qty}</dd></div>
          <div><dt>File</dt><dd>${escapeHtml(job.fileName || "Shop preview")}</dd></div>
          <div><dt>Status</dt><dd>${escapeHtml(job.status)}</dd></div>
        </dl>
        ${action}
      `;
      document.getElementById("approve")?.addEventListener("click", async () => {
        job.status = "Printing";
        await saveJob(job);
        draw(job);
      });
      document.getElementById("pay")?.addEventListener("click", async () => {
        job.paid = true;
        job.status = "Printing";
        await saveJob(job);
        draw(job);
      });
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[ch]);
    }
  </script>
</body>
</html>
